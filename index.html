<!doctype html>
<html lang="de">
  <head>
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/favicon/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon/favicon-16x16.png" />
    <link rel="manifest" href="./assets/favicon/site.webmanifest" />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Valhalla Rush</title>
  </head>
  <body>
    <h1>Valhalla Rush</h1>

    <main class="game">
      <canvas data-app width="720" height="480"></canvas>

      <section class="screen" id="startScreen">
        <h2 class="screen__title">Valhalla Rush</h2>
        <p class="screen__text">Defeat the golem king and collect the runes.</p>
        <div class="screen__actions">
          <button class="btn" id="startButton" type="button">Start</button>
        </div>
      </section>

      <section class="screen d-none" id="endScreen">
        <h2 class="screen__title" id="endTitle"></h2>
        <p class="screen__text" id="endStats"></p>
        <div class="screen__actions">
          <button class="btn" id="restartButton" type="button">Restart</button>
          <button class="btn btn--secondary" id="homeButton" type="button">Home</button>
        </div>
      </section>

      <button class="mute-btn" id="muteButton" type="button" aria-label="Toggle sound" title="Sound on/off (M)"></button>
    </main>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
